# This file is at repository root when the backend ZIP is extracted/uploaded.
# For the app monorepo instead, set the Render service Root Directory to backend.
services:
  - type: web
    name: veyra-listen-together
    runtime: go
    plan: free
    region: singapore
    numInstances: 1
    buildCommand: go build -trimpath -ldflags="-s -w" -o bin/veyra-server .
    startCommand: ./bin/veyra-server
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: GO_VERSION
        value: "1.27.2"
      - key: JAM_TRUST_PROXY
        value: "true"
      - key: JAM_PUBLIC_ORIGIN
        sync: false
      - key: JAM_ALLOWED_ORIGINS
        value: "https://veyra-website-mauve.vercel.app"
      - key: JAM_MAX_MEMBERS
        value: "5"
      - key: JAM_MAX_PARTIES
        value: "50"
      - key: JAM_MAX_UPCOMING_QUEUE
        value: "25"
      - key: JAM_CREATE_RATE_PER_MINUTE
        value: "2"
