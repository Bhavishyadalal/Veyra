name: Android Release APK

on:
  workflow_dispatch:

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        # The action defaults to "tools platform-tools", but Google's obsolete
        # "tools" package is no longer available. Command-line tools are
        # installed by the action itself; only platform-tools is needed here.
        packages: platform-tools
        log-accepted-android-sdk-licenses: false

    - name: Install Android build tools
      run: sdkmanager "platforms;android-36" "platforms;android-37.0" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

    - name: Setup Secrets (Keystore & local.properties)
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > veyra-release.jks
        {
          echo "storeFile=veyra-release.jks"
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
          echo "keyAlias=${{ secrets.KEY_ALIAS }}"
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
        } > keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew :app:assembleProdRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: veyra-prod-release-signed
        path: app/build/outputs/apk/prod/release/*.apk
